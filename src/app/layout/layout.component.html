<!-- Navbar superior: logo, botón menú móvil, usuario y Cerrar Sesión (CU2) -->
<header
  class="fixed top-0 inset-x-0 z-40 h-16 bg-white/90 backdrop-blur border-b border-slate-200"
>
  <div class="flex items-center justify-between h-full px-4 sm:px-6">
    <!-- Izquierda: hamburguesa (móvil) + marca -->
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="lg:hidden h-10 w-10 rounded-xl text-slate-600 hover:bg-slate-100 active:scale-95 transition"
        aria-label="Abrir menú de navegación"
      >
        <svg class="h-6 w-6 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="iconPaths['menu']" />
        </svg>
      </button>
      <a [routerLink]="menu().length ? menu()[0].route : '/login'" class="flex items-center gap-2.5">
        <span class="h-9 w-9 rounded-2xl bg-primary flex items-center justify-center shadow-sm">
          <span class="text-lg font-bold text-white leading-none">A</span>
        </span>
        <span class="text-lg font-semibold text-primary hidden sm:block">Attention</span>
      </a>
    </div>

    <!-- Derecha: nombre, rol y Cerrar Sesión (CU2) -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex flex-col items-end leading-tight">
        <span class="text-sm font-semibold text-slate-800">
          {{ usuario()?.nombre ?? 'Usuario' }}
        </span>
        <span class="text-xs text-slate-500">{{ rolLabel() }}</span>
      </div>
      <span
        class="h-9 w-9 rounded-full bg-container text-primary flex items-center justify-center text-sm font-bold"
        aria-hidden="true"
      >
        {{ inicial() }}
      </span>
      <button
        type="button"
        (click)="cerrarSesion()"
        class="flex items-center gap-2 h-9 px-3 rounded-full text-sm font-medium text-slate-600 hover:text-red-600 hover:bg-red-50 transition"
        aria-label="Cerrar sesión"
        title="Cerrar sesión (CU2)"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="iconPaths['logout']" />
        </svg>
        <span class="hidden md:inline">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</header>

<!-- Overlay oscuro detrás del Sidebar en pantallas pequeñas -->
@if (sidebarOpen()) {
  <div
    class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>
}

<!-- Sidebar de navegación dinámica por rol -->
<aside
  class="fixed top-16 bottom-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transition-transform duration-200 ease-in-out"
  [ngClass]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
  aria-label="Menú principal"
>
  <nav class="h-full flex flex-col overflow-y-auto px-3 py-4 gap-1">
    @for (item of menu(); track item.route) {
      <a
        [routerLink]="item.route"
        [ngClass]="
          isActive(item.route)
            ? 'bg-container text-primary border-l-4 border-primary font-semibold'
            : 'text-slate-600 hover:bg-slate-50 border-l-4 border-transparent'
        "
        class="flex items-center gap-3 px-3 py-2.5 rounded-r-xl text-sm transition"
      >
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="iconPaths[item.icon]" />
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

<!-- Contenido de las vistas de los 8 CUs -->
<main class="pt-16 lg:pl-64 min-h-screen bg-slate-100">
  <router-outlet />
</main>
