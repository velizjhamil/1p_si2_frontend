@if (mensaje()) {
 <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
 <div
 class="absolute inset-0 bg-primary/40 backdrop-blur-sm"
 (click)="cancelado.emit()"
 ></div>
 <div
 class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden"
 role="alertdialog"
 [attr.aria-label]="titulo()"
 >
 <div class="px-6 py-4" [class]="peligro() ? 'bg-red-600' : 'bg-primary'">
 <h2 class="text-lg font-bold text-white">{{ titulo() }}</h2>
 </div>
 <div class="p-6">
 <p class="text-sm text-gray-700 leading-relaxed">{{ mensaje() }}</p>
 <div class="flex justify-end gap-3 mt-6">
 <button
 type="button"
 (click)="cancelado.emit()"
 class="px-5 py-2.5 rounded-lg border border-primary/30 text-primary hover:bg-container transition text-sm font-medium"
 >
 Cancelar
 </button>
 <button
 type="button"
 (click)="confirmado.emit()"
 class="px-5 py-2.5 rounded-lg text-white transition text-sm font-medium"
 [class]="peligro() ? 'bg-red-600 hover:bg-red-500' : 'bg-primary hover:bg-accent hover:text-primary'"
 >
 {{ textoConfirmar() }}
 </button>
 </div>
 </div>
 </div>
 </div>
}
