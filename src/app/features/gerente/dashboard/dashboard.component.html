<div class="min-h-screen bg-white p-8">
  <div class="bg-container rounded-xl shadow-lg p-8 max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-primary">Panel de Gerencia</h1>
    <p class="text-gray-600 mt-2">Bienvenido, {{ usuario?.nombre ?? 'Usuario' }}</p>
    <span class="inline-block mt-2 px-3 py-1 rounded-full bg-accent text-primary text-sm">Rol: {{ usuario?.rol?.nombre_rol }}</span>
    <button (click)="cerrarSesion()" class="mt-6 bg-primary text-white px-4 py-2 rounded-lg hover:bg-accent hover:text-primary transition">
      Cerrar sesión
    </button>
  </div>
</div>
