<div class="min-h-screen flex items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-md bg-container rounded-4xl shadow-lg p-10">
    <!-- 1. Logo y encabezado de la app -->
    <div class="flex flex-col items-center text-center">
      <div class="h-12 w-12 rounded-2xl bg-primary flex items-center justify-center shadow-md">
        <span class="text-2xl font-bold text-white leading-none">A</span>
      </div>
      <h1 class="mt-4 text-3xl font-bold text-primary">Attention</h1>
      <p class="mt-1 text-sm text-slate-500">Sistema de Gestión de Inventario</p>
    </div>

    <!-- 2. Subtítulo de sección -->
    <div class="mt-8 text-center">
      <h2 class="text-xl font-semibold text-slate-800">Iniciar Sesión</h2>
      <p class="mt-1 text-sm text-slate-500">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- 3. Controles del formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
      <div>
        <label for="correo" class="block text-sm font-medium text-slate-700 mb-1.5">
          Correo Electrónico
        </label>
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400 pointer-events-none"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input
            id="correo"
            type="email"
            formControlName="correo"
            class="w-full bg-white rounded-full border border-transparent pl-11 pr-4 py-2.5 text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            placeholder="admin@attention.com"
          />
        </div>
      </div>

      <div>
        <label for="contrasena" class="block text-sm font-medium text-slate-700 mb-1.5">
          Contraseña
        </label>
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400 pointer-events-none"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            id="contrasena"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="contrasena"
            class="w-full bg-white rounded-full border border-transparent pl-11 pr-12 py-2.5 text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            placeholder="••••••••••••"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition"
            aria-label="Mostrar u ocultar contraseña"
          >
            @if (showPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- 4. Opciones auxiliares -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600">
          <input type="checkbox" formControlName="recordar" class="h-4 w-4 accent-primary cursor-pointer" />
          Recordar sesión
        </label>
        <a href="#" (click)="$event.preventDefault()" class="text-primary hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      @if (errorMessage()) {
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-2xl px-4 py-2.5">
          {{ errorMessage() }}
        </div>
      }

      <!-- 5. Botones de acción -->
      <button
        type="submit"
        [disabled]="isDisabled() || isLoading()"
        class="w-full flex items-center justify-center gap-2 bg-primary text-white rounded-full px-4 py-2.5 font-medium hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        @if (!isLoading()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        }
      </button>

      <div class="h-px bg-slate-300/60" aria-hidden="true"></div>

      <button
        type="button"
        class="w-full flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-700 rounded-full px-4 py-2.5 font-medium hover:bg-slate-50 transition"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
          continúa con Google
      </button>
    </form>

    <!-- 6. Aviso de seguridad del pie -->
    <div class="mt-8 flex items-center justify-center gap-1.5 text-xs text-slate-400">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-3.5 w-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      <span>Acceso protegido con autenticación de dos factores (2FA)</span>
    </div>
  </div>
</div>
